@if (selectedMix(); as selectedMix) {
  <div class="modal">
    <div class="modal-content" appClickedOutside (clickedOutside)="close.emit()" [style.background-color]="color()">
      <app-close-button (click)="close.emit()"/>
      <h2>{{ selectedMix.name }}</h2>
      <div class="mix-image">
        <img [src]="'/music/mixes/art/' + selectedMix.image | imageUrl" [alt]="selectedMix.name">
      </div>
      <p>{{ selectedMix.description }}</p>
      <div class="audio-player-wrapper">
        <audio controls preload="none" [src]="'/music/mixes/' + selectedMix.filename | imageUrl">
          Mate your browser cannot handle this audio player.
        </audio>
      </div>
      <a [href]="'/music/mixes/' + selectedMix.filename | imageUrl" [download]="selectedMix.filename">
        <span class="file-icon">🎧</span>
        Download {{ selectedMix.filename }}
      </a>
      <app-rating-bar [rating]="{id: selectedMix.id, ratings: selectedMix.rating}" />
    </div>
  </div>
}
