<div class="rating-bar">
  @for (reaction of reactions; track reaction.file; let i = $index) {
    <button (click)="onSelect(i)" class="button">
      <img [ngSrc]="imageService.imageUrl(reaction.file)"
           [alt]="reaction.alt"
           width="35"
           height="35"
           class="circle">
      <span class="count">
        {{ counts()[i] }}
      </span>
      <div class="hover-text" [style.color]="reaction.color">{{ reaction.label }}</div>
    </button>
  }
</div>
