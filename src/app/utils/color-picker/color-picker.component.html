<div class="color-selection">
  <label for="color">What colour would you like?</label>
  <input type="text" id="color" [value]="color()" (input)="selectColor($any($event.target).value)" name="color" placeholder="#ffffff">
  <div class="color-buttons">
    @for (swatch of swatches; track swatch.value) {
      <button type="button" class="color-button" [class.selected]="color() === swatch.value" (click)="selectColor(swatch.value)" [style.background-color]="swatch.value" [attr.aria-label]="swatch.label"></button>
    }
  </div>
</div>
