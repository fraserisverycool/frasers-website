
<div class="image-grid">
  @for (image of images(); track image) {
    <div class="image-container">
      <img [ngSrc]="'/misc/brexit/' + image | imageUrl" alt="Brexit Summit Top 8 Image" (click)="openImage(image)" width="100" height="200"/>
    </div>
  }
</div>

@if (selectedImage(); as selectedImage) {
  <div class="overlay" (click)="closeImage()">
    <img [ngSrc]="'/misc/brexit/' + selectedImage | imageUrl" alt="Brexit Summit Top 8 Image" class="enlarged" width="600" height="800"/>
  </div>
}
